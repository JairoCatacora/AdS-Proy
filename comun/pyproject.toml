[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comun"
version = "0.1.0"
description = "Librería común del banco de pruebas: logger JSONL, modelos y cliente HTTP con plazo"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[tool.setuptools]
packages = ["comun"]
